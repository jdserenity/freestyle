<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ff6b00">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Freestyle</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="screen">
    <button type="button" class="word-hit" data-mode="random" aria-label="New random word">
      <span class="word-fit" id="word-fit">
        <span id="word" class="word" aria-live="polite">…</span>
      </span>
    </button>
    <nav class="controls" aria-label="Next word">
      <button type="button" data-mode="random">Random</button>
      <button type="button" data-mode="1">1 syllable</button>
      <button type="button" data-mode="2">2 syllable</button>
      <button type="button" data-mode="3">3 syllable</button>
    </nav>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
